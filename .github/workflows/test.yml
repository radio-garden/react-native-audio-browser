name: Test

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - next
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (types, lint, format, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Typecheck
        run: yarn types

      - name: Lint
        run: yarn ci:lint

      - name: Format
        run: yarn ci:format

      - name: Test
        run: yarn test

  ios:
    # These three job names are the required status check contexts on main's
    # ruleset. Renaming one leaves its context permanently pending and blocks
    # every merge — put detail in step names instead.
    name: iOS (swift test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.2

      # Pinned, not `brew install`: formatter output shifts between releases, so
      # an unpinned version turns an unrelated PR into a repo-wide reformat. Keep
      # in step with whatever contributors run locally.
      - name: Install SwiftFormat
        env:
          SWIFTFORMAT_VERSION: 0.58.2
        run: |
          curl -fsSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -q swiftformat.zip
          chmod +x swiftformat
          sudo mv swiftformat /usr/local/bin/swiftformat
          swiftformat --version

      # `yarn ci:format:ios` locally; called directly here because this job has
      # no Node/Corepack setup.
      - name: Format
        run: swiftformat --lint ios

      # No --disable-sandbox here: CI runners are unsandboxed, so SwiftPM can
      # shell out to sandbox-exec to compile the manifest. See CLAUDE.md.
      - name: Test
        run: swift test

  android:
    name: Android (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      # The library is not a standalone Gradle project — it is pulled in by the
      # example app's autolinking, so node_modules has to exist first.
      - name: Install dependencies
        run: yarn install

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/example-native/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ktfmt's version is pinned by the Gradle plugin in android/build.gradle,
      # so this needs no separate install.
      - name: Format
        working-directory: apps/example-native/android
        run: ./gradlew :react-native-audio-browser:formatCheck --no-daemon --build-cache

      - name: Test
        working-directory: apps/example-native/android
        run: ./gradlew :react-native-audio-browser:testDebugUnitTest --no-daemon --build-cache

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/build/reports/tests/

      - name: Stop Gradle daemon
        if: always()
        working-directory: apps/example-native/android
        run: ./gradlew --stop
