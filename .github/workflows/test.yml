name: Test

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - next
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (types, lint, format, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Typecheck
        run: yarn types

      - name: Typecheck the example app
        run: yarn example types

      - name: Lint
        run: yarn ci:lint

      - name: Format
        run: yarn ci:format

      - name: Test
        run: yarn test

      - name: Glossary
        run: yarn vocab-check

      - name: Generated bridge matches codegen
        run: |
          yarn codegen
          git add --all nitrogen/generated
          if ! git --no-pager diff --cached --exit-code -- nitrogen/generated; then
            echo "::error title=Stale generated bridge::nitrogen/generated differs from what the codegen emits. Run \`corepack yarn codegen\` and commit nitrogen/generated."
            exit 1
          fi

  ios:
    # These three job names are the required status check contexts on main's
    # ruleset. Renaming one leaves its context permanently pending and blocks
    # every merge — put detail in step names instead.
    name: iOS (swift test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.4.1

      # Pinned, not `brew install`: formatter output shifts between releases, so
      # an unpinned version turns an unrelated PR into a repo-wide reformat. The
      # version comes from mise.toml, the same pin contributors install from —
      # bump it there and CI follows.
      #
      # Onto GITHUB_PATH, not /usr/local/bin: these runners are arm64 and put
      # Homebrew's /opt/homebrew/bin first, so a preinstalled swiftformat
      # shadowed the pinned one and lint ran under whatever the image shipped.
      - name: Install SwiftFormat
        run: |
          version=$(scripts/swiftformat.sh --pinned-version)
          echo "installing SwiftFormat $version"
          curl -fsSL -o swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${version}/swiftformat.zip"
          unzip -q swiftformat.zip
          chmod +x swiftformat
          mkdir -p "$RUNNER_TEMP/bin"
          mv swiftformat "$RUNNER_TEMP/bin/swiftformat"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The wrapper re-checks the version before formatting, so a shadowed pin
      # fails loudly here instead of showing up as dozens of files "needing
      # formatting" that were already correct.
      #
      # `yarn ci:format:ios` locally; the script is called directly because this
      # job has no Node/Corepack setup.
      - name: Format
        run: scripts/swiftformat.sh --lint ios

      # No --disable-sandbox here: CI runners are unsandboxed, so SwiftPM can
      # shell out to sandbox-exec to compile the manifest. See CLAUDE.md.
      - name: Test
        run: swift test

  android:
    name: Android (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      # The library is not a standalone Gradle project — it is pulled in by the
      # example app's autolinking, so node_modules has to exist first.
      - name: Install dependencies
        run: yarn install

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/example-native/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Robolectric fetches each SDK's android-all jar from Maven Central while the tests run, into
      # ~/.m2 rather than Gradle's cache, and a rate-limited fetch fails every test of that SDK.
      # The newest cache is restored, and saved again under what it holds once that changes.
      - name: Restore Robolectric SDKs
        id: robolectric-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-restore-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      # An access time of 0 marks each restored jar as unread until the tests read it.
      - name: Mark Robolectric SDKs unread
        run: |
          dir=~/.m2/repository/org/robolectric
          if [ -d "$dir" ]; then find "$dir" -type f -exec touch -a -d @0 {} +; fi

      # ktfmt's version is pinned by the Gradle plugin in android/build.gradle,
      # so this needs no separate install.
      - name: Format
        working-directory: apps/example-native/android
        run: ./gradlew :react-native-audio-browser:formatCheck --no-daemon --build-cache

      - name: Test
        id: test
        working-directory: apps/example-native/android
        run: ./gradlew :react-native-audio-browser:testDebugUnitTest --no-daemon --build-cache

      # After passing tests, a jar they did not read belongs to an SDK or Robolectric version no
      # test uses any more. After failing ones, every jar stays, and the cache is saved anyway so
      # the next run does not fetch the jars again. Nothing is pruned where reading a file leaves
      # its access time alone, nor when no jar was read.
      - name: Prune Robolectric SDKs
        id: robolectric
        if: always() && steps.test.outcome != 'skipped'
        run: |
          dir=~/.m2/repository/org/robolectric
          [ -d "$dir" ] || exit 0
          probe=$(mktemp -p "$dir")
          echo probe > "$probe"
          touch -a -d @0 "$probe"
          cat "$probe" > /dev/null
          probed=$(stat -c %X "$probe")
          rm "$probe"
          unread=$(find "$dir" -name '*.jar' -atime +1000 -printf '%h\n')
          read=$(find "$dir" -name '*.jar' -not -atime +1000 | head -1)
          if [ "${{ steps.test.outcome }}" = success ] && [ "$probed" != 0 ] && [ -n "$read" ] && [ -n "$unread" ]; then
            echo "unread, pruned:"
            echo "$unread"
            echo "$unread" | xargs -d '\n' rm -r
          fi
          jars=$(cd "$dir" && find . -name '*.jar' -printf '%P %s\n' | sort)
          echo "$jars"
          if [ -n "$jars" ]; then echo "key=$(echo "$jars" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"; fi

      # A run id ends each key, so a jar set saved before can be saved again as the newest cache.
      - name: Save Robolectric SDKs
        if: always() && steps.robolectric.outputs.key != '' && !startsWith(steps.robolectric-cache.outputs.cache-matched-key, format('{0}-robolectric-{1}-', runner.os, steps.robolectric.outputs.key))
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ steps.robolectric.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}

      # The example app builds with Cast; this compiles the library the way an app without it does.
      - name: Compile without Cast
        working-directory: apps/example-native/android
        run: ./gradlew :react-native-audio-browser:formatCheck :react-native-audio-browser:compileDebugKotlin -PAudioBrowser_castEnabled=false --no-daemon --build-cache

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/build/reports/tests/

      - name: Stop Gradle daemon
        if: always()
        working-directory: apps/example-native/android
        run: ./gradlew --stop
