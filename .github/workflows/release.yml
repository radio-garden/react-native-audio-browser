name: Release

on:
  schedule:
    - cron: '0 3 * * *' # nightly at 3am UTC, publishes prereleases from `next`
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'next' || github.ref }}
          fetch-depth: 0

      # semantic-release runs `git tag --merged <branch>` for every branch in
      # release.config.cjs. actions/checkout only creates a local branch for the
      # ref it checked out, so the others resolve to nothing and it dies with
      # `fatal: malformed object name main` before analysing a single commit.
      # Fetch each configured branch into a local ref, skipping the one already
      # checked out — git refuses to update the current branch and would fail
      # the step under `bash -e`.
      - name: Create local refs for semantic-release branches
        run: |
          current=$(git rev-parse --abbrev-ref HEAD)
          for branch in main next; do
            if [ "$branch" != "$current" ]; then
              spec="refs/heads/${branch}:refs/heads/${branch}"
              git fetch --no-tags --force origin "$spec"
            fi
          done
          git branch --list

      - name: Enable Corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install npm dependencies
        run: yarn install

      - name: Build lib
        run: yarn build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: '${{ github.actor }}@users.noreply.github.com'
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GIT_COMMITTER_EMAIL: '${{ github.actor }}@users.noreply.github.com'
        run: yarn release
